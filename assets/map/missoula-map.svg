<svg viewBox="0 0 820 620" width="820" height="620" xmlns="http://www.w3.org/2000/svg" font-family="Georgia, 'Times New Roman', serif">
  <defs>
    <style>
      .kicker { font-family: Georgia, serif; font-size: 13px; letter-spacing: 4px; fill: #4a5a45; }
      .title { font-family: Georgia, serif; font-size: 42px; fill: #33402f; }
      .subtitle { font-style: italic; font-size: 15px; fill: #55604c; }
      .state-label { font-size: 15px; letter-spacing: 3px; fill: #6b7566; }
      .town-label-bold { font-size: 17px; fill: #33402f; font-weight: bold; }
      .legend-title { font-size: 17px; fill: #33402f; font-weight: bold; }
      .legend-item { font-size: 13px; fill: #3d4a3a; }
      .brand-foot { font-size: 11px; letter-spacing: 3px; fill: #6b7566; }
      .mtn { fill: none; stroke: #9aa48f; stroke-width: 1.3; stroke-linejoin: round; opacity: 0.55; }
      .river { fill: none; stroke: #9db8c2; stroke-width: 2; opacity: 0.75; }
    </style>
  </defs>

  <rect x="0" y="0" width="820" height="620" fill="#f5f1e7"/>

  <!-- Header -->
  <text x="410" y="34" text-anchor="middle" class="kicker">TWIN FLOWERS CLEANING</text>
  <text x="410" y="82" text-anchor="middle" class="title">Missoula, Montana</text>

  <line x1="315" y1="103" x2="365" y2="103" stroke="#6b7566" stroke-width="1"/>
  <g transform="translate(410,103)">
    <path d="M0,-7 C3,-4 3,4 0,7 C-3,4 -3,-4 0,-7 Z" fill="#6b7566"/>
    <path d="M-7,0 C-4,-3 4,-3 7,0 C4,3 -4,3 -7,0 Z" fill="#6b7566"/>
    <circle r="2.3" fill="#f5f1e7"/>
  </g>
  <line x1="455" y1="103" x2="505" y2="103" stroke="#6b7566" stroke-width="1"/>

  <text x="410" y="130" text-anchor="middle" class="subtitle">The Garden City, nestled where five valleys meet.</text>

  <!-- ===================== MAP ===================== -->
  <g>
    <clipPath id="msoMapClip">
      <rect x="30" y="150" width="540" height="380"/>
    </clipPath>

    <g clip-path="url(#msoMapClip)">
      <!-- mountains ringing the valley -->
      <path class="mtn" d="M 40,190 L 58,164 L 74,186 L 92,156 L 110,182 L 128,160 L 146,184"/>
      <path class="mtn" d="M 46,220 L 64,196 L 80,216 L 98,190 L 116,214"/>
      <path class="mtn" d="M 440,180 L 458,154 L 474,176 L 492,148 L 510,174 L 528,152 L 546,176"/>
      <path class="mtn" d="M 450,210 L 468,188 L 484,208 L 502,184 L 520,206"/>
      <path class="mtn" d="M 200,470 L 218,448 L 234,468 L 252,444 L 270,466 L 288,446 L 306,468"/>
      <path class="mtn" d="M 320,485 L 338,463 L 354,483 L 372,460 L 390,482"/>

      <!-- Rivers converging near Missoula: Clark Fork, Bitterroot, Blackfoot -->
      <path class="river" d="M 60,300 C 150,310 220,306 300,300 C 360,296 400,300 440,304"/>
      <path class="river" d="M 300,470 C 320,420 305,370 300,300"/>
      <path class="river" d="M 500,220 C 470,250 450,275 440,304"/>

      <!-- Missoula valley shaded service area -->
      <ellipse cx="300" cy="300" rx="150" ry="90" fill="#a9b596" fill-opacity="0.5" stroke="#8a9a78" stroke-width="1.2"/>

      <!-- MONTANA label -->
      <text x="470" y="185" text-anchor="middle" class="state-label">MONTANA</text>

      <!-- Missoula marker (hub, bold) -->
      <g transform="translate(300,300)">
        <path d="M0,-11 L3.3,-3.3 L11,-3.3 L5,1.9 L7.4,11 L0,5.8 L-7.4,11 L-5,1.9 L-11,-3.3 L-3.3,-3.3 Z" fill="#2a3527"/>
        <text x="18" y="6" class="town-label-bold">Missoula</text>
      </g>
    </g>

    <!-- map frame -->
    <rect x="30" y="150" width="540" height="380" fill="none" stroke="#c9c2ae" stroke-width="1"/>

    <!-- Compass rose -->
    <g transform="translate(75,562)">
      <circle r="28" fill="none" stroke="#6b7566" stroke-width="1"/>
      <path d="M0,-22 L4.5,0 L0,22 L-4.5,0 Z" fill="#4a5a45"/>
      <path d="M-22,0 L0,-4.5 L22,0 L0,4.5 Z" fill="#8a9a78"/>
      <text x="0" y="-30" text-anchor="middle" font-size="11" fill="#4a5a45">N</text>
      <text x="0" y="39" text-anchor="middle" font-size="11" fill="#4a5a45">S</text>
    </g>
  </g>

  <!-- ===================== LEGEND ===================== -->
  <g transform="translate(592,205)">
    <circle cx="10" cy="0" r="9" fill="#a9b596"/>
    <text x="28" y="5" class="legend-title">Missoula</text>

    <text x="4" y="34" class="legend-item">&#9733; Service Area Includes:</text>
    <text x="18" y="58" class="legend-item">&#8226; Missoula and</text>
    <text x="18" y="76" class="legend-item">&#160;&#160;surrounding areas</text>

    <line x1="0" y1="110" x2="150" y2="110" stroke="#c9c2ae" stroke-width="1"/>
    <text x="0" y="140" font-style="italic" font-size="14" fill="#4a5a45">Same great service.</text>
    <text x="0" y="160" font-style="italic" font-size="14" fill="#4a5a45">Right in the Garden City.</text>

    <text x="0" y="210" class="brand-foot">TWIN FLOWERS CLEANING</text>
  </g>
</svg>
