<svg viewBox="0 0 820 660" width="820" height="660" xmlns="http://www.w3.org/2000/svg" font-family="Georgia, 'Times New Roman', serif">
  <defs>
    <style>
      .kicker { font-family: Georgia, serif; font-size: 13px; letter-spacing: 4px; fill: #4a5a45; }
      .title { font-family: Georgia, serif; font-size: 42px; fill: #33402f; }
      .subtitle { font-style: italic; font-size: 15px; fill: #55604c; }
      .state-label { font-size: 15px; letter-spacing: 3px; fill: #6b7566; }
      .town-label { font-size: 13.5px; fill: #33402f; }
      .town-label-bold { font-size: 15.5px; fill: #33402f; font-weight: bold; }
      .legend-title { font-size: 17px; fill: #33402f; font-weight: bold; }
      .legend-sub { font-size: 12.5px; letter-spacing: 1px; fill: #4a5a45; }
      .legend-item { font-size: 13px; fill: #3d4a3a; }
      .tagline { font-style: italic; font-size: 15px; fill: #4a5a45; }
      .brand-foot { font-size: 11px; letter-spacing: 3px; fill: #6b7566; }
      .mtn { fill: none; stroke: #9aa48f; stroke-width: 1.3; stroke-linejoin: round; opacity: 0.55; }
      .road { fill: none; stroke: #8c8577; stroke-width: 1.6; }
      .road-dash { fill: none; stroke: #8c8577; stroke-width: 1.3; stroke-dasharray: 2 3; }
      .river { fill: none; stroke: #9db8c2; stroke-width: 1.6; opacity: 0.7; }
    </style>
  </defs>

  <rect x="0" y="0" width="820" height="660" fill="#f5f1e7"/>

  <!-- Header -->
  <text x="410" y="34" text-anchor="middle" class="kicker">TWIN FLOWERS CLEANING</text>
  <text x="410" y="82" text-anchor="middle" class="title">Our Service Areas</text>

  <!-- divider with flower -->
  <line x1="285" y1="103" x2="375" y2="103" stroke="#6b7566" stroke-width="1"/>
  <g transform="translate(410,103)">
    <path d="M0,-7 C3,-4 3,4 0,7 C-3,4 -3,-4 0,-7 Z" fill="#6b7566"/>
    <path d="M-7,0 C-4,-3 4,-3 7,0 C4,3 -4,3 -7,0 Z" fill="#6b7566"/>
    <circle r="2.3" fill="#f5f1e7"/>
  </g>
  <line x1="445" y1="103" x2="535" y2="103" stroke="#6b7566" stroke-width="1"/>

  <text x="410" y="130" text-anchor="middle" class="subtitle">Proudly serving homes in the Bitterroot Valley and Bozeman, Montana.</text>

  <!-- ===================== MAP ===================== -->
  <g>
    <!-- crop frame -->
    <clipPath id="mapClip">
      <rect x="30" y="150" width="540" height="478"/>
    </clipPath>

    <g clip-path="url(#mapClip)">
      <!-- Montana western border (clipped, real geography) -->
      <path d="M 560.0,150.0 L 560.0,591.4 L 501.3,591.4 L 501.5,620.0 L 222.8,620.0 L 220.3,617.2 L 221.0,581.1 L 206.9,567.7 L 187.7,529.6 L 176.2,493.6 L 179.4,478.1 L 158.2,459.6 L 146.7,480.2 L 117.9,505.9 L 93.0,486.4 L 98.7,465.8 L 90.4,446.2 L 111.5,425.6 L 99.4,396.8 L 102.6,352.5 L 119.2,282.5 L 85.3,283.5 L 84.0,271.2 L 53.3,251.6 L 48.2,231.0 L 40.0,221.6 L 40.0,150.0 Z"
            fill="#efeadc" stroke="#9aa48f" stroke-width="1.6"/>

      <!-- hand-drawn mountain sketches along the western/northern edge -->
      <path class="mtn" d="M 40,200 L 55,180 L 68,196 L 82,168 L 96,192 L 110,178 L 122,198"/>
      <path class="mtn" d="M 46,225 L 60,206 L 74,222 L 88,200 L 102,220"/>
      <path class="mtn" d="M 400,170 L 415,148 L 430,166 L 448,142 L 464,164 L 480,146 L 498,168 L 515,150 L 532,170 L 550,152 L 565,172"/>
      <path class="mtn" d="M 420,195 L 436,176 L 452,192 L 470,172 L 486,190 L 502,174 L 520,192"/>
      <path class="mtn" d="M 470,400 L 485,378 L 500,396 L 516,374 L 532,394 L 548,376 L 562,396"/>
      <path class="mtn" d="M 460,430 L 476,412 L 492,428 L 508,408 L 524,426"/>

      <!-- Bitterroot Valley shaded service area -->
      <path d="M 150,242 C 178,248 190,270 183,296 C 179,316 166,320 160,336
               C 177,346 183,368 166,388 C 150,404 118,401 103,382
               C 87,366 90,344 99,330 C 83,318 79,298 96,279
               C 102,258 126,244 150,242 Z"
            fill="#a9b596" fill-opacity="0.55" stroke="#8a9a78" stroke-width="1.2"/>

      <!-- Bozeman / Gallatin Valley shaded service area -->
      <path d="M 500,392 C 540,397 562,424 557,455 C 562,486 541,511 505,516
               C 470,519 444,501 439,471 C 434,446 449,421 480,406
               C 488,401 494,397 500,392 Z"
            fill="#a8bcc4" fill-opacity="0.55" stroke="#7f97a0" stroke-width="1.2"/>

      <!-- Roads -->
      <path class="road" d="M 157.6,239.8 C 152,255 149,268 147.6,280.7 C 147,292 146.3,300 146.1,307.6 C 145,314 140,318 138.0,324.4 C 141,332 145,337 146.7,344.2 C 143,349 139,352 138.1,357.2"/>
      <path class="road-dash" d="M 138.1,357.2 C 132,372 128,384 121,399"/>

      <path class="road" d="M 157.6,239.8 C 200,255 230,266 256.6,276.2 C 278,296 292,312 305.4,329.5 C 314,358 320,382 328.1,403.1 C 348,412 362,420 379.3,427.9 C 405,433 422,428 442.7,422.7 C 460,432 472,440 486.0,446.1 C 493,452 497,458 502.4,464.5"/>

      <!-- highway shields -->
      <g transform="translate(168,293)">
        <rect x="-11" y="-9" width="22" height="16" rx="2" fill="#f5f1e7" stroke="#6b6b63" stroke-width="1"/>
        <text x="0" y="3" text-anchor="middle" font-size="10" fill="#4a4a44" font-family="Arial, sans-serif" font-weight="bold">93</text>
      </g>
      <g transform="translate(430,432)">
        <rect x="-12" y="-9" width="24" height="16" rx="2" fill="#f5f1e7" stroke="#6b6b63" stroke-width="1"/>
        <text x="0" y="3" text-anchor="middle" font-size="10" fill="#4a4a44" font-family="Arial, sans-serif" font-weight="bold">90</text>
      </g>

      <!-- MONTANA label -->
      <text x="470" y="185" text-anchor="middle" class="state-label">MONTANA</text>

      <!-- Town markers -->
      <!-- Florence -->
      <g transform="translate(147.6,280.7)">
        <path d="M0,-6 L1.8,-1.8 L6,-1.8 L2.7,1 L4,6 L0,3.2 L-4,6 L-2.7,1 L-6,-1.8 L-1.8,-1.8 Z" fill="#33402f"/>
        <text x="10" y="4" class="town-label">Florence</text>
      </g>
      <!-- Stevensville -->
      <g transform="translate(146.1,307.6)">
        <path d="M0,-6 L1.8,-1.8 L6,-1.8 L2.7,1 L4,6 L0,3.2 L-4,6 L-2.7,1 L-6,-1.8 L-1.8,-1.8 Z" fill="#33402f"/>
        <text x="10" y="4" class="town-label">Stevensville</text>
      </g>
      <!-- Victor -->
      <g transform="translate(138.0,324.4)">
        <path d="M0,-6 L1.8,-1.8 L6,-1.8 L2.7,1 L4,6 L0,3.2 L-4,6 L-2.7,1 L-6,-1.8 L-1.8,-1.8 Z" fill="#33402f"/>
        <text x="-10" y="4" text-anchor="end" class="town-label">Victor</text>
      </g>
      <!-- Corvallis -->
      <g transform="translate(146.7,344.2)">
        <path d="M0,-6 L1.8,-1.8 L6,-1.8 L2.7,1 L4,6 L0,3.2 L-4,6 L-2.7,1 L-6,-1.8 L-1.8,-1.8 Z" fill="#33402f"/>
        <text x="10" y="4" class="town-label">Corvallis</text>
      </g>
      <!-- Hamilton (hub, bold) -->
      <g transform="translate(138.1,357.2)">
        <path d="M0,-9 L2.7,-2.7 L9,-2.7 L4,1.5 L6,9 L0,4.8 L-6,9 L-4,1.5 L-9,-2.7 L-2.7,-2.7 Z" fill="#2a3527"/>
        <text x="14" y="5" class="town-label-bold">Hamilton</text>
      </g>

      <!-- Bozeman (hub, bold) -->
      <g transform="translate(502.4,464.5)">
        <path d="M0,-9 L2.7,-2.7 L9,-2.7 L4,1.5 L6,9 L0,4.8 L-6,9 L-4,1.5 L-9,-2.7 L-2.7,-2.7 Z" fill="#2a3527"/>
        <text x="-14" y="5" text-anchor="end" class="town-label-bold">Bozeman</text>
      </g>
      <!-- Belgrade (small ref point, part of Bozeman area) -->
      <g transform="translate(486.0,446.1)">
        <circle r="3" fill="#33402f"/>
      </g>
    </g>

    <!-- map frame -->
    <rect x="30" y="150" width="540" height="478" fill="none" stroke="#c9c2ae" stroke-width="1"/>

    <!-- Compass rose -->
    <g transform="translate(75,592)">
      <circle r="30" fill="none" stroke="#6b7566" stroke-width="1"/>
      <path d="M0,-24 L5,0 L0,24 L-5,0 Z" fill="#4a5a45"/>
      <path d="M-24,0 L0,-5 L24,0 L0,5 Z" fill="#8a9a78"/>
      <text x="0" y="-32" text-anchor="middle" font-size="11" fill="#4a5a45">N</text>
      <text x="0" y="41" text-anchor="middle" font-size="11" fill="#4a5a45">S</text>
      <text x="-38" y="4" text-anchor="middle" font-size="11" fill="#4a5a45">W</text>
      <text x="38" y="4" text-anchor="middle" font-size="11" fill="#4a5a45">E</text>
    </g>
  </g>

  <!-- ===================== LEGEND ===================== -->
  <g transform="translate(592,205)">
    <circle cx="10" cy="0" r="9" fill="#a9b596"/>
    <text x="28" y="5" class="legend-title">Bitterroot Valley</text>

    <text x="4" y="34" class="legend-item">★ Service Area Includes:</text>
    <text x="18" y="58" class="legend-item">• Florence</text>
    <text x="18" y="78" class="legend-item">• Stevensville</text>
    <text x="18" y="98" class="legend-item">• Victor</text>
    <text x="18" y="118" class="legend-item">• Corvallis</text>
    <text x="18" y="138" class="legend-item">• Hamilton</text>

    <circle cx="10" cy="185" r="9" fill="#a8bcc4"/>
    <text x="28" y="190" class="legend-title">Bozeman</text>

    <text x="4" y="219" class="legend-item">★ Service Area Includes:</text>
    <text x="18" y="243" class="legend-item">• Bozeman and</text>
    <text x="18" y="261" class="legend-item">  surrounding areas</text>

    <line x1="0" y1="300" x2="150" y2="300" stroke="#c9c2ae" stroke-width="1"/>
    <text x="0" y="330" font-style="italic" font-size="14" fill="#4a5a45">Same great service.</text>
    <text x="0" y="350" font-style="italic" font-size="14" fill="#4a5a45">Two convenient locations.</text>

    <text x="0" y="400" class="brand-foot">TWIN FLOWERS CLEANING</text>
  </g>
</svg>
